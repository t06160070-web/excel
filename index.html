<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系統櫃廢料統計系統(精準現場版)</title>
    <!-- 引入 Excel 處理套件 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background-color: #f1f3f5; margin: 0; }
        h2 { text-align: center; margin: 15px 0; font-size: 20px; color: #212529; }
        .box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .factory-title { font-size: 18px; font-weight: bold; color: #007bff; border-left: 5px solid #007bff; padding-left: 8px; margin: 15px 0 10px 0; }
        .machine-row { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e9ecef; }
        .machine-name { font-size: 16px; font-weight: bold; color: #495057; }
        .counter { display: flex; align-items: center; gap: 8px; }
        .btn-step { width: 50px; height: 50px; font-size: 24px; font-weight: bold; background: white; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn-step:active { background: #e9ecef; }
        .num-input { width: 55px; height: 46px; text-align: center; font-size: 20px; font-weight: bold; border: 1px solid #ced4da; border-radius: 6px; background-color: #fff; color: #000; }
        .action-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .table-wrap { overflow-x: auto; margin-top: 10px; border: 1px solid #666; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; background: white; }
        th, td { border: 1px solid #666; padding: 8px; min-width: 50px; color: #000; }
        th { background-color: #e9ecef; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🪵 廠區廢料每日過數 (1-2包精準版)</h2>
    
    <div class="box">
        <label style="font-weight:bold; font-size:16px;">選擇記錄日期：</label>
        <input type="date" id="recordDate" style="width:100%; padding:12px; font-size:16px; box-sizing:border-box; border-radius:6px; border:1px solid #ced4da; margin-top:5px; font-weight:bold;"><br>

        <div class="factory-title">E3 廠區</div>
        <div class="machine-row"><span class="machine-name">330 機台</span><div class="counter"><button class="btn-step" onclick="step('E3_330',-1)">-</button><input type="number" id="E3_330" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('E3_330',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">380 機台</span><div class="counter"><button class="btn-step" onclick="step('E3_380',-1)">-</button><input type="number" id="E3_380" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('E3_380',1)">+</button></div></div>
        
        <div class="factory-title">E4 廠區</div>
        <div class="machine-row"><span class="machine-name">330 機台</span><div class="counter"><button class="btn-step" onclick="step('E4_330',-1)">-</button><input type="number" id="E4_330" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('E4_330',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">Nesting</span><div class="counter"><button class="btn-step" onclick="step('E4_Nesting',-1)">-</button><input type="number" id="E4_Nesting" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('E4_Nesting',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">長青 機台</span><div class="counter"><button class="btn-step" onclick="step('E4_長青',-1)">-</button><input type="number" id="E4_長青" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('E4_長青',1)">+</button></div></div>
        
        <div class="factory-title">W8 廠區</div>
        <div class="machine-row"><span class="machine-name">330 機台</span><div class="counter"><button class="btn-step" onclick="step('W8_330',-1)">-</button><input type="number" id="W8_330" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('W8_330',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">Nesting</span><div class="counter"><button class="btn-step" onclick="step('W8_Nesting',-1)">-</button><input type="number" id="W8_Nesting" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('W8_Nesting',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">邰展 機台</span><div class="counter"><button class="btn-step" onclick="step('W8_邰展',-1)">-</button><input type="number" id="W8_邰展" class="num-input" value="0" min="0" max="9"><button class="btn-step" onclick="step('W8_邰展',1)">+</button></div></div>
        
        <button class="action-btn" style="background-color:#28a745;" onclick="saveTodayData()">💾 儲存今日數據</button>
        <button class="action-btn" style="background-color:#17a2b8; margin-top:25px;" onclick="exportToExcel()">🟢 匯出 Excel 檔案</button>
        <button class="action-btn" style="background-color:#dc3545; padding:8px; font-size:14px; margin-top:15px;" onclick="clearDatabase()">⚠️ 清除所有歷史記錄</button>
    </div>

    <div class="box">
        <h3 style="margin-top:0; font-size:16px; color:#333;">歷史記錄預覽 (左右滑動觀看)</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th rowspan="3">日期</th><th colspan="8">廢料</th></tr>
                    <tr><th colspan="2">E3</th><th colspan="3">E4</th><th colspan="3">W8</th></tr>
                    <tr><th>330</th><th>380</th><th>330</th><th>Nesting</th><th>長青</th><th>330</th><th>Nesting</th><th>邰展</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script>
    const keys = ['E3_330', 'E3_380', 'E4_330', 'E4_Nesting', 'E4_長青', 'W8_330', 'W8_Nesting', 'W8_邰展'];
    let db = JSON.parse(localStorage.getItem('waste_db')) || []; 
    
    // 預設鎖定台灣當天日期
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    document.getElementById('recordDate').value = `${year}-${month}-${date}`;
    
    renderTable();

    // 點擊加減功能
    function step(id, val) {
        const input = document.getElementById(id);
        let current = parseInt(input.value) || 0;
        current += val;
        if (current < 0) current = 0;
        input.value = current;
    }

    // 儲存當天數據
    function saveTodayData() {
        const dateVal = document.getElementById('recordDate').value;
        if (!dateVal) return alert('❌ 請先選擇日期！');
        const dayStr = new Date(dateVal).getDate() + '日';
        
        let hasData = false;
        let hasAbnormalData = false; // 檢查是否有異常大於 2 包的資料
        let abnormalMessage = '';

        const currentData = { date: dayStr };
        
        keys.forEach(k => {
            const v = parseInt(document.getElementById(k).value) || 0;
            if (v > 0) hasData = true;
            
            // 【新防呆核心】：如果輸入超過 2 包，觸發標記並記錄哪台機台有異常
            if (v > 2) {
                hasAbnormalData = true;
                const nameText = k.replace('_', ' ');
                abnormalMessage += `・${nameText} 輸入了 ${v} 包\n`;
            }
            
            currentData[k] = v === 0 ? '' : v;
        });

        if (!hasData) {
            alert('⚠️ 目前所有機台數量都是 0，請先點選數量再儲存！');
            return;
        }

        // 【新防呆核心】：如果偵測到大於 2 包，跳出視窗讓現場人員進行二次確認
        if (hasAbnormalData) {
            const confirmAbnormal = confirm(`⚠️ 【異常數量提醒】\n\n偵測到以下機台數量大於 2 包：\n${abnormalMessage}\n平時一天通常不超過 2 包，請問這個數字確定正確無誤嗎？`);
            if (!confirmAbnormal) return; // 如果現場人員按取消，就中斷儲存讓他修改
        }

        const idx = db.findIndex(i => i.date === dayStr);
        if (idx > -1) {
            if(!confirm(`提醒：${dayStr} 已經有記錄了，確定要覆蓋它嗎？`)) return;
            db[idx] = currentData;
        } else {
            db.push(currentData);
        }
        
        db.sort((a, b) => parseInt(a.date) - parseInt(b.date));
        localStorage.setItem('waste_db', JSON.stringify(db));
        renderTable();
        
        // 儲存成功後自動重設為 0
        keys.forEach(k => document.getElementById(k).value = 0);
        alert(`✅ ${dayStr} 數據已成功存檔！`);
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        db.forEach(item => {
            let html = `<tr><td><strong>${item.date}</strong></td>`;
            keys.forEach(k => {
                html += `<td>${item[k]}</td>`;
            });
            html += '</tr>';
            tbody.innerHTML += html;
        });
    }

    function clearDatabase() {
        if (confirm('⚠️ 確定要清空所有天數的記錄嗎？\n清空後無法復原，請確認您已下載 Excel 檔案！')) {
            db = [];
            localStorage.removeItem('waste_db');
            renderTable();
            alert('🗑️ 歷史記錄已全數清除！');
        }
    }

    function exportToExcel() {
        if (db.length === 0) return alert('❌ 目前沒有任何數據可以匯出喔！');
        const wb = XLSX.utils.book_new();
        const wsData = [
            ['日期', '廢料', '', '', '', '', '', '', ''],
            ['', 'E3', '', 'E4', '', '', 'W8', '', ''],
            ['', '330', '380', '330', 'Nesting', '長青', '330', 'Nesting', '邰展']
        ];
        
        db.forEach(item => {
            const row = [item.date];
            keys.forEach(k => row.push(item[k]));
            wsData.push(row);
        });
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!merges'] = [
            { s: { r: 0, c: 1 }, e: { r: 0, c: 8 } }, 
            { s: { r: 1, c: 1 }, e: { r: 1, c: 2 } }, 
            { s: { r: 1, c: 3 }, e: { r: 1, c: 5 } }, 
            { s: { r: 1, c: 6 }, e: { r: 1, c: 8 } }  
        ];
        
        XLSX.utils.book_append_sheet(wb, ws, '工作表1');
        XLSX.writeFile(wb, '系統櫃廢料統計表.xlsx');
    }
    </script>
</body>
</html>
