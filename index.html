<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>廠區廢料過數系統</title>
    <!-- 【核心修復】：改用穩定的 CDNJS 官方完整版 SheetJS，解決 XLSX is not defined 錯誤 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f1f3f5; margin: 0; }
        h2 { text-align: center; margin: 12px 0; font-size: 19px; }
        .box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .factory-title { font-size: 17px; font-weight: bold; color: #007bff; border-left: 5px solid #007bff; padding-left: 8px; margin: 12px 0 8px 0; }
        .machine-row { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #e9ecef; }
        .machine-name { font-size: 15px; font-weight: bold; color: #495057; }
        .counter { display: flex; align-items: center; gap: 8px; }
        .btn-step { width: 46px; height: 46px; font-size: 22px; font-weight: bold; background: white; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-input { width: 50px; height: 42px; text-align: center; font-size: 18px; font-weight: bold; border: 1px solid #ced4da; border-radius: 6px; }
        .action-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .table-wrap { overflow-x: auto; margin-top: 10px; border: 1px solid #666; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; background: white; }
        th, td { border: 1px solid #666; padding: 8px; min-width: 48px; color: #000; }
        th { background-color: #e9ecef; font-weight: bold; }
        .btn-edit { background: #ffc107; color: #212529; border: 1px solid #ffc107; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🪵 廠區廢料每日過數 (正式 .xlsx 秒開版)</h2>
    <div class="box">
        <label style="font-weight:bold; font-size:15px; color:#28a745;" id="modeStatus">✨ 目前模式：全新輸入當天數據</label><br>
        <label style="font-weight:bold; font-size:15px; display:block; margin-top:5px;">選擇記錄日期：</label>
        <input type="date" id="recordDate" style="width:100%; padding:10px; font-size:16px; box-sizing:border-box; border-radius:6px; border:1px solid #ced4da; margin-top:5px; font-weight:bold;"><br>

        <div class="factory-title">E3 廠區</div>
        <div class="machine-row"><span class="machine-name">330 機台</span><div class="counter"><button class="btn-step" onclick="step('E3_330',-1)">-</button><input type="number" id="E3_330" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('E3_330',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">380 機台</span><div class="counter"><button class="btn-step" onclick="step('E3_380',-1)">-</button><input type="number" id="E3_380" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('E3_380',1)">+</button></div></div>
        
        <div class="factory-title">E4 廠區</div>
        <div class="machine-row"><span class="machine-name">330 機台</span><div class="counter"><button class="btn-step" onclick="step('E4_330',-1)">-</button><input type="number" id="E4_330" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('E4_330',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">Nesting</span><div class="counter"><button class="btn-step" onclick="step('E4_Nesting',-1)">-</button><input type="number" id="E4_Nesting" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('E4_Nesting',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">長青 機台</span><div class="counter"><button class="btn-step" onclick="step('E4_長青',-1)">-</button><input type="number" id="E4_長青" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('E4_長青',1)">+</button></div></div>
        
        <div class="factory-title">W8 廠區</div>
        <div class="machine-row"><span class="machine-name">330 機台</span><div class="counter"><button class="btn-step" onclick="step('W8_330',-1)">-</button><input type="number" id="W8_330" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('W8_330',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">Nesting</span><div class="counter"><button class="btn-step" onclick="step('W8_Nesting',-1)">-</button><input type="number" id="W8_Nesting" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('W8_Nesting',1)">+</button></div></div>
        <div class="machine-row"><span class="machine-name">邰展 機台</span><div class="counter"><button class="btn-step" onclick="step('W8_邰展',-1)">-</button><input type="number" id="W8_邰展" class="num-input" value="0" min="0"><button class="btn-step" onclick="step('W8_邰展',1)">+</button></div></div>
        
        <button class="action-btn" style="background-color:#28a745;" onclick="saveTodayData(false)">💾 儲存今日數據</button>
        <button class="action-btn" style="background-color:#6c757d; margin-top:5px; padding:8px; font-size:14px;" onclick="saveTodayData(true)">🛑 當天確定無廢料包 (記為0包)</button>
        <button class="action-btn" style="background-color:#17a2b8; margin-top:25px;" onclick="exportToExcel()">🟢 一鍵下載真實 .xlsx 檔案</button>
        <button class="action-btn" style="background-color:#dc3545; padding:6px; font-size:12px; margin-top:15px;" onclick="clearDatabase()">⚠️ 清除所有記錄</button>
    </div>

    <div class="box">
        <h3 style="margin-top:0; font-size:15px;">歷史記錄預覽 (💡點擊黃色按鈕可回頭修改數據)</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th rowspan="3">修改</th><th rowspan="3">日期</th><th colspan="8">廢料</th></tr>
                    <tr><th colspan="2">E3</th><th colspan="3">E4</th><th colspan="3">W8</th></tr>
                    <tr><th>330</th><th>380</th><th>330</th><th>Nesting</th><th>長青</th><th>330</th><th>Nesting</th><th>邰展</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
    const keys = ['E3_330', 'E3_380', 'E4_330', 'E4_Nesting', 'E4_長青', 'W8_330', 'W8_Nesting', 'W8_邰展'];
    let db = [];
    try { db = JSON.parse(localStorage.getItem('waste_db_v6_true_xlsx')) || []; } catch(e) { db = []; }

    // 設定本地日期
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
    const currentDate = String(now.getDate()).padStart(2, '0');
    const todayInputString = `${currentYear}-${currentMonth}-${currentDate}`;
    document.getElementById('recordDate').value = todayInputString;
    renderTable();

    function step(id, val) {
        const input = document.getElementById(id);
        let current = parseInt(input.value) || 0;
        current += val;
        if (current < 0) current = 0;
        input.value = current;
    }

    function saveTodayData(forceZero) {
        const dateVal = document.getElementById('recordDate').value;
        if (!dateVal) return alert('請選擇日期');
        
        const dateObj = new Date(dateVal);
        const dayStr = dateObj.getDate() + '日';
        const formattedDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        
        let hasData = false;
        let hasAbnormal = false;
        const currentData = { date: dayStr, fullDate: formattedDate };
        
        keys.forEach(k => {
            const v = forceZero ? 0 : (parseInt(document.getElementById(k).value) || 0);
            if (v > 0) hasData = true;
            if (v > 2) hasAbnormal = true;
            currentData[k] = v === 0 ? '' : v;
        });

        if (!forceZero && !hasData) return alert('⚠️ 請先輸入數量再儲存！');
        if (!forceZero && hasAbnormal && !confirm('⚠️ 有機台輸入超過 2 包，確定正確嗎？')) return;

        const idx = db.findIndex(i => i.date === dayStr);
        if (idx > -1) {
            if(!confirm(`確定要覆蓋、更新 ${dayStr} 的資料嗎？`)) return;
            db[idx] = currentData;
        } else {
            db.push(currentData);
        }
        
        db.sort((a, b) => parseInt(a.date) - parseInt(b.date));
        localStorage.setItem('waste_db_v6_true_xlsx', JSON.stringify(db));
        renderTable();
        
        keys.forEach(k => document.getElementById(k).value = 0);
        document.getElementById('recordDate').value = todayInputString;
        document.getElementById('modeStatus').innerText = "✨ 目前模式：全新輸入當天數據";
        document.getElementById('modeStatus').style.color = "#28a745";
        alert(`✅ ${dayStr} 資料處理成功！`);
    }

    function editDay(dayString) {
        const target = db.find(item => item.date === dayString);
        if (!target) return;
        
        if (target.fullDate) {
            document.getElementById('recordDate').value = target.fullDate;
        } else {
            const dNum = parseInt(dayString);
            document.getElementById('recordDate').value = `${currentYear}-${currentMonth}-${String(dNum).padStart(2, '0')}`;
        }
        
        keys.forEach(k => {
            document.getElementById(k).value = target[k] === '' ? 0 : target[k];
        });
        
        document.getElementById('modeStatus').innerText = `✏️ 目前模式：正在修改 ${dayString} 的舊資料 (儲存後將直接覆蓋)`;
        document.getElementById('modeStatus').style.color = "#dc3545";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        db.forEach(item => {
            let html = `<tr>
                <td><button class="btn-edit" onclick="editDay('${item.date}')">修改</button></td>
                <td><strong>${item.date}</strong></td>`;
            keys.forEach(k => html += `<td>${item[k]}</td>`);
            html += '</tr>';
            tbody.innerHTML += html;
        });
    }

    function clearDatabase() {
        if (confirm('確定要清空所有記錄嗎？')) {
            db = [];
            localStorage.removeItem('waste_db_v6_true_xlsx');
            renderTable();
            document.getElementById('modeStatus').innerText = "✨ 目前模式：全新輸入當天數據";
            document.getElementById('modeStatus').style.color = "#28a745";
            alert('已清空！');
        }
    }

    // 💡【修正匯出邏輯】：修正多層級表頭的欄位合併範圍（!merges），完美輸出 .xlsx
    function exportToExcel() {
        if (typeof XLSX === 'undefined') {
            return alert('❌ 系統尚未載入 SheetJS 套件，請檢查網路連線！');
        }
        if (db.length === 0) return alert('❌ 目前沒有任何數據可以匯出喔！');
        
        // 1. 初始化活頁簿
        const wb = XLSX.utils.book_new();
        
        // 2. 建立 3 層對齊表頭數據 (A欄=日期, B~I欄對應 8 台機台)
        const wsData = [
            ['日期', '廢料', '', '', '', '', '', '', ''],
            ['', 'E3', '', 'E4', '', '', 'W8', '', ''],
            ['', '330', '380', '330', 'Nesting', '長青', '330', 'Nesting', '邰展']
        ];
        
        // 3. 將資料庫數值填入
        db.forEach(item => {
            const row = [item.date];
            keys.forEach(k => row.push(item[k] !== '' ? item[k] : ''));
            wsData.push(row);
        });
        
        // 4. 定義精確的跨欄合併範圍 (r=row, c=column，從 0 開始算)
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!merges'] = [
            { s: { r: 0, c: 0 }, e: { r: 2, c: 0 } }, // 日期欄向下合併 3 行 (A1:A3)
            { s: { r: 0, c: 1 }, e: { r: 0, c: 8 } }, // 廢料大標題橫跨 B1 到 I1
            { s: { r: 1, c: 1 }, e: { r: 1, c: 2 } }, // E3 廠區橫跨 B2:C2
            { s: { r: 1, c: 3 }, e: { r: 1, c: 5 } }, // E4 廠區橫跨 D2:F2
            { s: { r: 1, c: 6 }, e: { r: 1, c: 8 } }  // W8 廠區橫跨 G2:I2
        ];
        
        XLSX.utils.book_append_sheet(wb, ws, '廢料統計');
        
        // 5. 輸出 ArrayBuffer 格式並觸發下載
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = '系統櫃廢料統計表.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    </script>
</body>
</html>
