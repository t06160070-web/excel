<!DOCTYPE html> 

<html lang="zh-TW"> 

<head> 

    <meta charset="UTF-8"> 

    <title>系統櫃廢料統計系統</title> 

    <!-- 引入 Excel 處理套件 --> 

    <script src="https://jsdelivr.net"></script> 

    <style> 

        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; } 

        .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; } 

        input[type="number"] { width: 60px; padding: 5px; font-size: 16px; text-align: center; } 

        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; } 

        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: center; } 

        th, td { border: 1px solid #333; padding: 8px; } 

        th { background-color: #e9ecef; } 

    </style> 

</head> 

<body> 

    <h2>🪵 系統櫃廢料包每日過數系統</h2> 

     

    <div class="box"> 

        日期：<input type="date" id="recordDate"><br><br> 

        <strong>E3 廠區：</strong> 

        330 <input type="number" id="E3_330" value="0"> |  

        380 <input type="number" id="E3_380" value="0"><br><br> 

         

        <strong>E4 廠區：</strong> 

        330 <input type="number" id="E4_330" value="0"> |  

        Nesting <input type="number" id="E4_Nesting" value="0"> |  

        長青 <input type="number" id="E4_長青" value="0"><br><br> 

         

        <strong>W8 廠區：</strong> 

        330 <input type="number" id="W8_330" value="0"> |  

        Nesting <input type="number" id="W8_Nesting" value="0"> |  

        邰展 <input type="number" id="W8_邰展" value="0"><br><br> 

         

        <button onclick="saveTodayData()" style="background-color: #28a745; color: white; border: none; border-radius: 4px;">💾 儲存今日數據</button> 

        <button onclick="exportToExcel()" style="background-color: #17a2b8; color: white; border: none; border-radius: 4px;">🟢 匯出 Excel 檔</button> 

    </div> 

 

    <div class="box"> 

        <h3>歷史記錄預覽</h3> 

        <table> 

            <thead> 

                <tr><th rowspan="3">日期</th><th colspan="8">廢料</th></tr> 

                <tr><th colspan="2">E3</th><th colspan="3">E4</th><th colspan="3">W8</th></tr> 

                <tr><th>330</th><th>380</th><th>330</th><th>Nesting</th><th>長青</th><th>330</th><th>Nesting</th><th>邰展</th></tr> 

            </thead> 

            <tbody id="tableBody"></tbody> 

        </table> 

    </div> 

<script> 

    // 欄位對應順序 

    const keys = ['E3_330', 'E3_380', 'E4_330', 'E4_Nesting', 'E4_長青', 'W8_330', 'W8_Nesting', 'W8_邰展']; 

    let db = []; // 暫存資料庫 

     

    // 自動將日期預設為今天 

    document.getElementById('recordDate').valueAsDate = new Date(); 

 

    // 儲存當天數據 

    function saveTodayData() { 

        const dateVal = document.getElementById('recordDate').value; 

        if (!dateVal) return alert('請先選擇日期！'); 

        const dayStr = new Date(dateVal).getDate() + '日'; 

         

        const currentData = { date: dayStr }; 

        keys.forEach(k => { 

            const v = parseInt(document.getElementById(k).value) || 0; 

            currentData[k] = v === 0 ? '' : v; // 0 包就自動留白 

        }); 

 

        const idx = db.findIndex(i => i.date === dayStr); 

        if (idx > -1) db[idx] = currentData; else db.push(currentData); 

        db.sort((a, b) => parseInt(a.date) - parseInt(b.date)); 

 

        // 刷新網頁表格畫面 

        const tbody = document.getElementById('tableBody'); 

        tbody.innerHTML = ''; 

        db.forEach(item => { 

            let html = `<tr><td>${item.date}</td>`; 

            keys.forEach(k => html += `<td>${item[k]}</td>`); 

            html += '</tr>'; 

            tbody.innerHTML += html; 

        }); 

 

        // 輸入欄位歸零，方便明天使用 

        keys.forEach(k => document.getElementById(k).value = 0); 

        alert(dayStr + ' 數據已儲存，可在下方表格查看！'); 

    } 

 

    // 匯出成 Excel 檔案 

    function exportToExcel() { 

        if (db.length === 0) return alert('目前沒有數據可以匯出喔！'); 

        const wb = XLSX.utils.book_new(); 

         

        // 建立 Excel 標題結構 

        const wsData = [ 

            ['日期', '廢料', '', '', '', '', '', '', ''], 

            ['', 'E3', '', 'E4', '', '', 'W8', '', ''], 

            ['', '330', '380', '330', 'Nesting', '長青', '330', 'Nesting', '邰展'] 

        ]; 

         

        db.forEach(item => { 

            const row = [item.date]; 

            keys.forEach(k => row.push(item[k])); 

            wsData.push(row); 

        }); 

         

        const ws = XLSX.utils.aoa_to_sheet(wsData); 

         

        // 設定跨欄合併 

        ws['!merges'] = [ 

            { s: { r: 0, c: 1 }, e: { r: 0, c: 8 } }, // 廢料大標題 

            { s: { r: 1, c: 1 }, e: { r: 1, c: 2 } }, // E3 合併 

            { s: { r: 1, c: 3 }, e: { r: 1, c: 5 } }, // E4 合併 

            { s: { r: 1, c: 6 }, e: { r: 1, c: 8 } }  // W8 合併 

        ]; 

         

        XLSX.utils.book_append_sheet(wb, ws, '工作表1'); 

        XLSX.writeFile(wb, '系統櫃廢料統計表.xlsx'); 

    } 

    </script> 

</body> 

</html>
